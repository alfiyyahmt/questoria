<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Questoria - Profile</title>
</head>
<body>

<h1>Questoria</h1>

<nav>
    <a href="/">Dashboard</a>
    <a href="/library">My Library</a>
    <a href="/backlog">Backlog</a>
    <a href="/quests">Quests</a>
    <a href="/profile">Profile</a>
    <a href="/logout">Logout</a>
</nav>

<hr>

<h2>Profile</h2>

<div>

    <h3 th:text="${player.displayName}">
        Player
    </h3>

    <p>
        Steam Username:
        <span th:text="${player.steamAccount.username}">
            Steam Username
        </span>
    </p>

    <p>
        Steam ID:
        <span th:text="${player.steamAccount.steamId}">
            Steam ID
        </span>
    </p>

    <p>
        Steam Profile:
        <a
                th:href="${player.steamAccount.profileUrl}"
                th:text="${player.steamAccount.profileUrl}"
                target="_blank"
        >
            Steam Profile
        </a>
    </p>

</div>

</body>
</html>
